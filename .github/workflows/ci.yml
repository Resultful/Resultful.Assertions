name: ci

on:
  push:
    branches: [ main ]
  pull_request: # any base branch, so stacked pull requests are checked too
  workflow_dispatch:
    inputs:
      publish:
        description: Push the packages in the release plan to nuget.org and tag them (main only)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # `build` is the check main's branch protection requires; keep the name.
  # Merging to main never pushes a package: only a manual run on main with `publish` ticked does
  # (docs/decisions/0004-publish-only-what-changed.md).
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # SourceLink and the package's repository commit

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Resultful.Assertions.slnx

      - name: Build
        run: dotnet build Resultful.Assertions.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test Resultful.Assertions.slnx --configuration Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Pack
        run: dotnet pack Resultful.Assertions.slnx --configuration Release --no-build -p:ContinuousIntegrationBuild=true -o artifacts

      # Which packages changed since their release tag, and which have a new version to publish.
      # Fails if a version goes backwards or a package would ship against a changed, unreleased dependency.
      - name: Release plan
        run: dotnet run eng/release-plan.cs -- --nuget --out artifacts/release-plan.txt --summary "$GITHUB_STEP_SUMMARY"

      - name: Check package shape
        run: dotnet run eng/verify-package.cs -- --plan artifacts/release-plan.txt artifacts/*.nupkg

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: artifacts
          if-no-files-found: error

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check file names (ls-lint)
        uses: ls-lint/action@a87c5eb4fb26d7af1bd0adba203dd1e76f7e94eb # v2.3.2

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Audit workflows (zizmor)
        run: uvx zizmor@1.31.1 --offline --format github .

  # Runs only when someone starts the workflow by hand on main with `publish` ticked. It pushes just the
  # packages in the release plan (those with a new version), then tags each "<id>/v<version>" so the next
  # plan diffs against it. --skip-duplicate is a safety net for a rerun, not the selection mechanism.
  publish:
    name: publish
    needs: [ build, lint ]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # release tags
    environment: release
    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: artifacts

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: source/global.json

      - name: Push planned packages to nuget.org
        env:
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
        run: |
          set -euo pipefail
          if [ ! -s artifacts/release-plan.txt ]; then
            echo "Release plan is empty: nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while read -r id version; do
            [ -n "$id" ] || continue
            echo "Pushing $id $version"
            dotnet nuget push "artifacts/$id.$version.nupkg" --api-key "$NUGET_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done < artifacts/release-plan.txt

      - name: Tag released packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r id version; do
            [ -n "$id" ] || continue
            tag="$id/v$version"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
              echo "Tag $tag already exists"
              continue
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
            echo "Tagged $tag at $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          done < artifacts/release-plan.txt
